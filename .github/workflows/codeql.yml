# CodeQL Analysis for Oxide/Rust Plugins
#
# Purpose: Run GitHub CodeQL C# security analysis on all plugins/**/*.cs files.
# Why build-mode: none: Oxide plugins are standalone .cs files with no .csproj.
# They reference game-server runtime assemblies unavailable in CI.
# Results uploaded to: Security tab → Code scanning alerts.

name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**/*.cs'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**/*.cs'
  schedule:
    # Run weekly on Monday at 7:00 AM UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:csharp'
