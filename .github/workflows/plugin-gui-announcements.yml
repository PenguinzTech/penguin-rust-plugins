name: plugin-gui-announcements

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scanners/**'
      - '.github/workflows/plugin-gui-announcements.yml'

permissions:
  contents: write
  packages: write
  id-token: write
  issues: write

env:
  SLUG: gui-announcements
  FILENAME: GUIAnnouncements.cs

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install scanners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y clamav clamav-freshclam yara jq unzip
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam --quiet || true
          pip install semgrep
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          GH_TOKEN="${GH_TOKEN:-${GITHUB_TOKEN}}" gh release download v8.18.4 \
            --repo gitleaks/gitleaks \
            --pattern 'gitleaks_8.18.4_linux_x64.tar.gz' \
            --output /tmp/gitleaks.tar.gz
          tar -xz -C /usr/local/bin -f /tmp/gitleaks.tar.gz gitleaks
          rm /tmp/gitleaks.tar.gz
          gh release download v0.69.3 \
            --repo aquasecurity/trivy \
            --pattern 'trivy_0.69.3_Linux-64bit.tar.gz' \
            --output /tmp/trivy.tar.gz
          tar -xz -C /usr/local/bin -f /tmp/trivy.tar.gz trivy
          rm /tmp/trivy.tar.gz

      - name: Install oras
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6  # v1.X.Y
        with:
          version: 1.2.3

      - name: Install cosign
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9  # v3.X.Y
        with:
          cosign-release: v2.2.4

      - name: Fetch plugin source + metadata
        id: fetch
        run: |
          set -eu
          mkdir -p /tmp/reports
          curl -fsSL "https://umod.org/plugins/${SLUG}.cs" -o /tmp/fresh.cs
          curl -fsSL "https://umod.org/plugins/${SLUG}.json" -o /tmp/meta.json
          FRESH_SHA=$(sha256sum /tmp/fresh.cs | cut -d' ' -f1)
          UPSTREAM_VERSION=$(jq -r '.latest_release_version // .version // "unknown"' /tmp/meta.json)
          UPSTREAM_AUTHOR=$(jq -r '.author // "unknown"' /tmp/meta.json)
          echo "fresh_sha=${FRESH_SHA}" >> "$GITHUB_OUTPUT"
          echo "upstream_version=${UPSTREAM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream_author=${UPSTREAM_AUTHOR}" >> "$GITHUB_OUTPUT"

      - name: Dedup check
        id: dedup
        run: |
          set -eu
          PREV_HASH_FILE="plugins/${SLUG}/${SLUG}.hash"
          if [ -f "${PREV_HASH_FILE}" ]; then
            COMMITTED_SHA=$(awk '{print $1}' "${PREV_HASH_FILE}")
            if [ "${COMMITTED_SHA}" = "${{ steps.fetch.outputs.fresh_sha }}" ]; then
              echo "Already published — no-op."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Scan — ClamAV
        if: steps.dedup.outputs.skip == 'false'
        run: clamscan /tmp/fresh.cs | tee /tmp/reports/clamav.txt

      - name: Scan — YARA
        if: steps.dedup.outputs.skip == 'false'
        run: yara -r scanners/yara-rules/ /tmp/fresh.cs | tee /tmp/reports/yara.txt

      - name: Scan — Semgrep
        if: steps.dedup.outputs.skip == 'false'
        run: semgrep --config scanners/semgrep-rules/ --config p/csharp --json --output /tmp/reports/semgrep.json /tmp/fresh.cs || true

      - name: Scan — gitleaks
        if: steps.dedup.outputs.skip == 'false'
        run: gitleaks detect --source /tmp/fresh.cs --report-path /tmp/reports/gitleaks.json --report-format json --no-git || true

      - name: Scan — trivy
        if: steps.dedup.outputs.skip == 'false'
        run: trivy fs /tmp/fresh.cs | tee /tmp/reports/trivy.txt

      - name: Evaluate scan policy
        if: steps.dedup.outputs.skip == 'false'
        id: policy
        run: |
          set -eu
          FRESH_SHA="${{ steps.fetch.outputs.fresh_sha }}"
          # Allowlist check
          if grep -q "^${FRESH_SHA}" scanners/allowlist.txt 2>/dev/null; then
            echo "On allowlist — skipping critical gate."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CRITICAL=0
          grep -qiE "^Infected files: [1-9]" /tmp/reports/clamav.txt && CRITICAL=1 && echo "ClamAV: infection detected"
          grep -qE "critical" /tmp/reports/yara.txt && CRITICAL=1 && echo "YARA: critical match"
          jq -e '.results[] | select(.extra.severity == "ERROR")' /tmp/reports/semgrep.json >/dev/null 2>&1 && CRITICAL=1 && echo "Semgrep: ERROR finding"
          jq -e 'length > 0' /tmp/reports/gitleaks.json >/dev/null 2>&1 && CRITICAL=1 && echo "gitleaks: secret detected"
          grep -qE "HIGH|CRITICAL" /tmp/reports/trivy.txt && CRITICAL=1 && echo "trivy: HIGH/CRITICAL finding"
          if [ "$CRITICAL" = "1" ]; then
            echo "CRITICAL findings — quarantining, no publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open quarantine issue
        if: steps.dedup.outputs.skip == 'false' && steps.policy.outputs.publish == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EPOCH=$(date +%s)
          BODY_FILE=/tmp/issue-body.md
          {
            echo "## Quarantined: ${SLUG} @ ${EPOCH}"
            echo ""
            echo "Upstream SHA256: ${{ steps.fetch.outputs.fresh_sha }}"
            echo "Upstream version: ${{ steps.fetch.outputs.upstream_version }}"
            echo ""
            echo "### ClamAV"; echo '```'; cat /tmp/reports/clamav.txt; echo '```'
            echo "### YARA";   echo '```'; cat /tmp/reports/yara.txt;   echo '```'
            echo "### Semgrep"; echo '```json'; cat /tmp/reports/semgrep.json; echo '```'
            echo "### gitleaks"; echo '```json'; cat /tmp/reports/gitleaks.json; echo '```'
            echo "### trivy"; echo '```'; cat /tmp/reports/trivy.txt; echo '```'
          } > "$BODY_FILE"
          gh label create "plugin-quarantine" --color "B60205" --description "Plugin failed scan gate" 2>/dev/null || true
          gh label create "plugin:${SLUG}" --color "1D76DB" --description "Plugin-specific: ${SLUG}" 2>/dev/null || true
          gh issue create \
            --title "[SCAN-FAIL] ${SLUG} — ${EPOCH}" \
            --label "plugin-quarantine,plugin:${SLUG}" \
            --body-file "$BODY_FILE"
          exit 1

      - name: Commit scan-clean artifacts
        if: steps.dedup.outputs.skip == 'false' && steps.policy.outputs.publish == 'true'
        id: commit
        run: |
          set -eu
          EPOCH=$(date +%s)
          mkdir -p "plugins/${SLUG}/reports"
          cp /tmp/fresh.cs "plugins/${SLUG}/${FILENAME}"
          (cd "plugins/${SLUG}" && sha256sum "${FILENAME}" > "${SLUG}.hash")
          cp /tmp/reports/* "plugins/${SLUG}/reports/"
          syft "file:plugins/${SLUG}/${FILENAME}" -o cyclonedx-json > "plugins/${SLUG}/sbom.cdx.json"
          jq -n \
            --arg slug "${SLUG}" \
            --arg filename "${FILENAME}" \
            --arg version "${EPOCH}" \
            --arg sha256 "${{ steps.fetch.outputs.fresh_sha }}" \
            --arg upstream_version "${{ steps.fetch.outputs.upstream_version }}" \
            --arg upstream_author "${{ steps.fetch.outputs.upstream_author }}" \
            --arg fetched_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg fetched_by "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{
              slug: $slug,
              filename: $filename,
              version: $version,
              sha256: $sha256,
              source_url: ("https://umod.org/plugins/" + $slug),
              source_raw_url: ("https://umod.org/plugins/" + $slug + ".cs"),
              source_api_url: ("https://umod.org/plugins/" + $slug + ".json"),
              upstream_author: $upstream_author,
              upstream_version: $upstream_version,
              fetched_at: $fetched_at,
              fetched_by: $fetched_by,
              attribution_notice: ("Source: https://umod.org/plugins/" + $slug + " — author: " + $upstream_author + ". Redistributed unmodified; all rights remain with the upstream author and umod.org.")
            }' > "plugins/${SLUG}/provenance.json"
          {
            echo "# ${SLUG}"
            echo ""
            echo "**Upstream source:** https://umod.org/plugins/${SLUG}"
            echo "**Upstream author:** ${{ steps.fetch.outputs.upstream_author }}"
            echo "**Upstream version:** ${{ steps.fetch.outputs.upstream_version }}"
            echo ""
            echo "This file is an unmodified redistribution of the upstream plugin hosted at umod.org."
            echo "All copyright and licensing remain with the upstream author. This repository adds"
            echo "only: scan reports, a SHA256 hash file, SBOM, and packaging metadata."
            echo ""
            echo "Report any attribution or licensing concerns via a GitHub issue."
          } > "plugins/${SLUG}/ATTRIBUTION.md"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "plugins/${SLUG}/"
          git commit -m "plugin(${SLUG}): v${EPOCH} — umod version ${{ steps.fetch.outputs.upstream_version }} (scan clean)"
          # Retry push with rebase — concurrent plugin workflows can race on main.
          # Each commit touches only plugins/${SLUG}/ so rebase is always conflict-free.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push attempt ${attempt} rejected — pulling and retrying..."
            git pull --rebase origin main
            sleep $((RANDOM % 5 + 1))
          done
          echo "epoch=${EPOCH}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (signed tarballs are the primary consumer artifact)
        if: steps.dedup.outputs.skip == 'false' && steps.policy.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EPOCH: ${{ steps.commit.outputs.epoch }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -eu
          TAG="${SLUG}-${EPOCH}"
          STAGE=/tmp/stage
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -r "plugins/${SLUG}/." "$STAGE/"
          (cd /tmp && tar -czf "${SLUG}-${EPOCH}.tar.gz" -C stage .)
          (cd /tmp && zip -r "${SLUG}-${EPOCH}.zip" . -i stage/\* >/dev/null)
          # Use relative basenames — sha256sum writes whatever path it's given into the
          # sidecar, and `sha256sum -c` verifies against that literal path. Consumers in
          # other tempdirs need basename-only references to work.
          (cd /tmp && sha256sum "${SLUG}-${EPOCH}.tar.gz" > "${SLUG}-${EPOCH}.tar.gz.sha256")
          (cd /tmp && sha256sum "${SLUG}-${EPOCH}.zip"    > "${SLUG}-${EPOCH}.zip.sha256")
          # Keyless blob signing — produces detached .sig + .pem (cert). Consumer verifies
          # with `cosign verify-blob --certificate-identity-regexp ... --certificate-oidc-issuer https://token.actions.githubusercontent.com`.
          # This makes the GitHub Release a standalone-verifiable artifact — no registry needed.
          cosign sign-blob --yes \
            --output-signature "/tmp/${SLUG}-${EPOCH}.tar.gz.sig" \
            --output-certificate "/tmp/${SLUG}-${EPOCH}.tar.gz.pem" \
            "/tmp/${SLUG}-${EPOCH}.tar.gz"
          cosign sign-blob --yes \
            --output-signature "/tmp/${SLUG}-${EPOCH}.zip.sig" \
            --output-certificate "/tmp/${SLUG}-${EPOCH}.zip.pem" \
            "/tmp/${SLUG}-${EPOCH}.zip"
          gh release create "$TAG" \
            --title "${SLUG} ${EPOCH}" \
            --notes "Scanned redistribution of umod plugin '${SLUG}' upstream version ${{ steps.fetch.outputs.upstream_version }}. See plugins/${SLUG}/reports/ in the tree for full scan output. Tarballs are cosign-signed (keyless / Sigstore) — verify with \`cosign verify-blob\`." \
            "/tmp/${SLUG}-${EPOCH}.tar.gz" \
            "/tmp/${SLUG}-${EPOCH}.tar.gz.sha256" \
            "/tmp/${SLUG}-${EPOCH}.tar.gz.sig" \
            "/tmp/${SLUG}-${EPOCH}.tar.gz.pem" \
            "/tmp/${SLUG}-${EPOCH}.zip" \
            "/tmp/${SLUG}-${EPOCH}.zip.sha256" \
            "/tmp/${SLUG}-${EPOCH}.zip.sig" \
            "/tmp/${SLUG}-${EPOCH}.zip.pem" \
            "plugins/${SLUG}/${SLUG}.hash" \
            "plugins/${SLUG}/provenance.json" \
            "plugins/${SLUG}/sbom.cdx.json" \
            "plugins/${SLUG}/ATTRIBUTION.md"

      - name: Publish OCI artifact
        if: steps.dedup.outputs.skip == 'false' && steps.policy.outputs.publish == 'true'
        env:
          EPOCH: ${{ steps.commit.outputs.epoch }}
        run: |
          set -eu
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin
          REF="ghcr.io/${{ github.repository_owner }}/penguin-rust-plugins/${SLUG}"
          REF_LOWER="${REF,,}"
          cd "plugins/${SLUG}"
          oras push "${REF_LOWER}:${EPOCH}" \
            --artifact-type application/vnd.penguin.rust-plugin+json \
            --annotation "dev.penguinztech.slug=${SLUG}" \
            --annotation "dev.penguinztech.filename=${FILENAME}" \
            --annotation "dev.penguinztech.sha256=${{ steps.fetch.outputs.fresh_sha }}" \
            --annotation "dev.penguinztech.upstream-version=${{ steps.fetch.outputs.upstream_version }}" \
            --annotation "dev.penguinztech.upstream-url=https://umod.org/plugins/${SLUG}" \
            --annotation "dev.penguinztech.scan-date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.version=${EPOCH}" \
            "${FILENAME}:text/plain" \
            "${SLUG}.hash:text/plain" \
            "provenance.json:application/json" \
            "sbom.cdx.json:application/vnd.cyclonedx+json" \
            "ATTRIBUTION.md:text/markdown" \
            reports/
          oras tag "${REF_LOWER}:${EPOCH}" latest

      - name: Cosign sign + attest
        if: steps.dedup.outputs.skip == 'false' && steps.policy.outputs.publish == 'true'
        env:
          EPOCH: ${{ steps.commit.outputs.epoch }}
          COSIGN_EXPERIMENTAL: "1"
        run: |
          set -eu
          REF_LOWER="ghcr.io/${{ github.repository_owner }}/penguin-rust-plugins/${SLUG}"
          REF_LOWER="${REF_LOWER,,}"
          cosign sign --yes "${REF_LOWER}:${EPOCH}"
          cosign attest --yes --predicate "plugins/${SLUG}/sbom.cdx.json" --type cyclonedx "${REF_LOWER}:${EPOCH}"
          cosign attest --yes --predicate "plugins/${SLUG}/provenance.json" --type custom "${REF_LOWER}:${EPOCH}"

      - name: Ensure package visibility is public
        if: steps.dedup.outputs.skip == 'false' && steps.policy.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            "/orgs/${{ github.repository_owner }}/packages/container/penguin-rust-plugins%2F${SLUG}/visibility" \
            -f visibility=public || echo "WARNING: could not set package public (may be a user-owned repo, not an org)"

      - name: Notify base image repo
        if: steps.dedup.outputs.skip == 'false' && steps.policy.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.PLUGINS_DISPATCH_TOKEN }}
          EPOCH: ${{ steps.commit.outputs.epoch }}
        run: |
          gh api repos/${{ github.repository_owner }}/penguin-rust-base/dispatches \
            -f event_type=plugin-updated \
            -F "client_payload[slug]=${SLUG}" \
            -F "client_payload[filename]=${FILENAME}" \
            -F "client_payload[version]=${EPOCH}" \
            -F "client_payload[oci_ref]=ghcr.io/${{ github.repository_owner }}/penguin-rust-plugins/${SLUG}:latest" || echo "WARNING: cross-repo dispatch failed (token missing or insufficient scope)"
